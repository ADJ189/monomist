name = "monomist"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# This is the ONLY Wrangler config file in this repo -- do not add a
# wrangler.json/wrangler.jsonc alongside it. Wrangler silently prefers a
# JSON(C) config over this TOML one with no warning if both exist, so a
# stray wrangler.jsonc (e.g. one auto-generated by some other `wrangler`
# command) would make everything below -- the Worker script, the /api/*
# routes, the ASSETS binding, the [env.production] block -- dead
# configuration despite `wrangler deploy` exiting successfully. Confirmed
# via `wrangler deploy --dry-run`: with a bare wrangler.jsonc present
# (no `main`) it reported "No bindings found" and a static-assets-only
# upload, silently skipping worker/index.ts entirely.
#
# Serves the Vite build output for everything that isn't /api/*.
# Build the frontend first (`npm run build`) so ./dist exists, then
# `wrangler deploy` / `wrangler dev`.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
ENVIRONMENT = "development"
PUBLIC_APP_URL = "http://localhost:8787"

# Optional KV namespace backing the rate limiter and (later) the session
# store in production. Without this binding, the Worker falls back to an
# in-memory rate limiter scoped to a single isolate -- fine for local dev,
# not for production traffic across multiple edge locations. Provision
# with `wrangler kv namespace create monomist_kv` and paste the id below.
# [[kv_namespaces]]
# binding = "MONOMIST_KV"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, SESSION_SECRET)
# are NOT set here -- see .dev.vars.example for local dev and
# `wrangler secret put <NAME>` for production. Never commit real values.

# `npm run worker:deploy` always passes --env production (see
# package.json) so this is the config that's actually live -- the
# top-level [vars] above are for `wrangler dev` / a bare `wrangler
# deploy` only, and their localhost URL and "development" ENVIRONMENT
# would be wrong for the real deployment if used by mistake.
[env.production]
vars = { ENVIRONMENT = "production", PUBLIC_APP_URL = "https://REPLACE_WITH_PRODUCTION_DOMAIN" }
